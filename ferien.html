        <p class="kicker reveal">Ferien</p>

      </div>
    </section>

    <section class="section section--grey">
      <div class="container">
        <!-- So fügst du Ferien hinzu: Bilder in den Ordner "ferien" legen und eine Karte kopieren.
             data-images: alle Bilder, getrennt mit |  (das erste wird auf der Karte gezeigt)
             data-text: der Text, der in der Grossansicht getippt wird
             Für ein Bild die Zeile mit "Foto folgt" ersetzen durch:
             <div class="print__img"><img src="ferien/DATEINAME.jpg" alt="Kurze Beschreibung" loading="lazy"></div> -->
        <div class="gallery">
          <figure class="print reveal tilt" data-anim="flip" data-images="" data-text="">
            <div class="print__img print__img--empty"><span>Foto folgt</span></div>
            <figcaption><h3>[Ort]</h3><p>[Monat Jahr]</p></figcaption>
          </figure>
          <figure class="print reveal tilt" data-anim="flip" data-images="" data-text="">
            <div class="print__img print__img--empty"><span>Foto folgt</span></div>
            <figcaption><h3>[Ort]</h3><p>[Monat Jahr]</p></figcaption>
          </figure>
          <figure class="print reveal tilt" data-anim="flip" data-images="" data-text="">
            <div class="print__img print__img--empty"><span>Foto folgt</span></div>
            <figcaption><h3>[Ort]</h3><p>[Monat Jahr]</p></figcaption>
          </figure>
          <figure class="print reveal tilt" data-anim="flip" data-images="" data-text="">
            <div class="print__img print__img--empty"><span>Foto folgt</span></div>

  <!-- Grossansicht für 3D-Drucke -->
  <div class="lightbox" hidden>
    <button class="lightbox__close" aria-label="Schliessen">×</button>
    <div class="lightbox__body">
      <div class="lightbox__stage">
        <img class="lightbox__img" src="" alt="">
        <button class="lightbox__nav lightbox__nav--prev" aria-label="Vorheriges Bild">‹</button>
        <button class="lightbox__nav lightbox__nav--next" aria-label="Nächstes Bild">›</button>
      </div>
      <div class="lightbox__thumbs"></div>
      <div class="lightbox__info">
        <h3 class="lightbox__title"></h3>
        <p class="lightbox__text"><span class="lightbox__typed"></span><span class="caret">|</span></p>
      </div>
    </div>
